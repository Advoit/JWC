<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32563b" />
      <stop offset="1" stop-color="#27452e" />
    </linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3324" />
